title: MongoDB 9.0 AI Agent Lab
teaser: Build RAG, single-agent, and two-agent AI systems that investigate a real
  MongoDB 9.0 upgrade case — all running locally with Ollama.
description: |
  In this hands-on lab, you'll build three AI systems of increasing complexity.

  You'll start with RAG — giving an LLM access to MongoDB 9.0 release notes so it can answer questions it was never trained on. Then you'll build an agent that chooses its own diagnostic tools. Finally, you'll split the work across two specialized agents.

  Everything runs locally. No cloud. No API keys. Just Ollama, Python, and Jupyter.
